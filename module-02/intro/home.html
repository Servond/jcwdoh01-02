<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
    <title>Document</title>
    <style>
      h1 {
        color: blue;
      }
      h2 {
        color: orange;
        font-size: 42px;
      }

      /* Ini untuk selector class */
      .container-2 {
        margin: 40px;
        padding: 24px;
        border: 1px solid black;
        border-radius: 8px;
        background-color: aliceblue;
        text-align: center;
      }

      .container-2 h1,
      h2 {
        font-size: 84px;
      }

      /* Ini untuk selector id */
      #sub-2 {
        font-size: 42px;
      }
    </style>
  </head>
  <body>
    <div>
      <div
        style="
          border: 1px solid black;
          border-radius: 8px;
          margin: 20px auto 20px auto;
          padding: 24px;
          height: 400px;
          width: 600px;
          text-align: center;
          background-color: antiquewhite;
        "
      >
        <h1 style="color: red; font-size: 124px">Ini Header</h1>
        <h2>Ini Subheader</h2>
      </div>
      <div class="container-2">
        <h1>Ini Header</h1>
        <h2 id="sub-2">Ini Subheader</h2>
      </div>
      <div class="container-3">
        <h1>Ini Header</h1>
        <h2>Ini Subheader</h2>
      </div>
    </div>
  </body>
</html>
